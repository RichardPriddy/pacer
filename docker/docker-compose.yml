
services:

   pacer-web:
     image: ${DOCKER_REGISTRY-}web
     ports: 
      - 9980:8080
     env_file: 
       - .env
       - .env.secret
     build:
       context: ..
       dockerfile: src/Pacer.Web/Dockerfile
     healthcheck:
       test: curl --fail http://localhost:8080/health-check/pingdom-xml || exit 1
       interval: 40s
       timeout: 30s
       retries: 3
       start_period: 60s

   pacer-db:
     image: postgres:17.6
     hostname: pacer-db
     container_name: pacer-db
     env_file: .env
     volumes: 
      - ./.containers/pacer-db:/var/lib/postgresql/data
     ports:
      - 5433:5433
     healthcheck:
       test: ["CMD-SHELL", "pg_isready -U pacer -d pacer || exit 1"]
       interval: 10s
       timeout: 5s
       retries: 5